[project]
name = "media-restorer"
version = "0.1.0"
description = "Restore old photos and films using Real-ESRGAN, GFPGAN and ffmpeg"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Laurent", email = "lolo.pupub@free.fr" }
]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.3",
    "torchvision>=0.18",
    "realesrgan>=0.3",
    "basicsr>=1.4",
    "opencv-python>=4.9",
    "Pillow>=10.0",
    "PyQt6>=6.6",
    "pyqtgraph>=0.13",
    "tqdm>=4.66",
    "numpy>=1.26",
]

[project.optional-dependencies]
gfpgan = [
    "gfpgan>=1.3",
    "facexlib>=0.3",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "sphinx-autodoc-typehints>=2.0",
    "myst-parser>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.4",
]

[project.scripts]
media-restorer = "media_restorer.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

# PyTorch CPU-only (évite de télécharger les binaires CUDA inutiles)
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Déclare ce répertoire comme racine de workspace autonome (isolé du parent)
[tool.uv.workspace]
members = []

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-qt>=4.5.0",
]
docs = [
    "sphinx>=9.1.0",
    "sphinx-autodoc-typehints>=3.10.2",
    "sphinx-rtd-theme>=3.1.0",
]
